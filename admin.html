<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAIL DIGITALS | Administration</title><style>body{font-family:Arial;margin:20px;background:#f4f6f8;color:#20303d}.box{background:#fff;padding:24px;max-width:1150px;margin:auto;border:1px solid #ddd;border-radius:12px}input,textarea,select{width:100%;padding:9px;margin:5px 0 12px;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:6px;background:#1769aa;color:white;font-weight:bold;cursor:pointer;margin:3px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}.panel{border-top:1px solid #ddd;padding-top:15px}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.muted{color:#657585}.danger{background:#a33d3d}pre{white-space:pre-wrap;background:#f4f6f8;padding:12px}@media(max-width:650px){.row{grid-template-columns:1fr}table{display:block;overflow-x:auto}}</style></head><body><div class="box"><h1>HAIL DIGITALS Administration</h1><p class="muted">Private administration • Test payment environment</p><label>Administrator key<input id="key" type="password" autocomplete="current-password"></label><div class="tabs"><button onclick="loadAttempts()">Attempts</button><button onclick="loadPayments()">Payments</button><button onclick="loadCodes()">Access Codes</button></div><div id="output" class="panel">Enter your administrator key and select a section.</div><hr><h2>Generate Access Codes</h2><div class="row"><label>Package<select id="plan"><option value="single">Single Examination — GH₵10</option><option value="week">7-Day Access — GH₵30</option><option value="month">30-Day Access — GH₵70</option><option value="quarter">90-Day Access — GH₵150</option></select></label><label>Number of codes<input id="count" type="number" min="1" max="500" value="10"></label></div><button onclick="generateCodes()">Generate Codes</button><p id="msg"></p><hr><h2>Add Practice Question</h2><div class="row"><label>Programme<input id="p"></label><label>Category<input id="cat"></label><label>Difficulty<select id="d"><option>Easy</option><option>Medium</option><option>Hard</option></select></label></div><label>Question<textarea id="q"></textarea></label><div class="row"><label>A<input id="a"></label><label>B<input id="b"></label><label>C<input id="c"></label><label>D<input id="e"></label></div><label>Correct option (0=A, 1=B, 2=C, 3=D)<input id="correct" type="number" min="0" max="3"></label><label>Explanation<textarea id="ex"></textarea></label><button onclick="addQuestion()">Add Question</button><p id="qmsg"></p></div><script>
const $=id=>document.getElementById(id),headers=()=>({'x-admin-key':$('key').value,'Content-Type':'application/json'});async function request(url,opts={}){let r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function table(rows,cols){return '<div style="overflow:auto"><table><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+cols.map(c=>'<td>'+String(c[0](x)??'')+'</td>').join('')+'</tr>').join('')+'</table></div>'}async function loadAttempts(){try{let d=await request('/api/attempts');$('output').innerHTML='<h2>Recent examination attempts</h2>'+table(d,[[x=>x.candidate_name,'Candidate'],[x=>x.programme,'Programme'],[x=>x.mode,'Mode'],[x=>x.percentage+'%','Score'],[x=>x.completed_at,'Completed']])}catch(e){$('output').textContent=e.message}}async function loadPayments(){try{let d=await request('/api/admin/payments');$('output').innerHTML='<h2>Payment records (test mode)</h2>'+table(d,[[x=>x.reference,'Reference'],[x=>x.email,'Candidate'],[x=>x.planName,'Package'],[x=>'GH₵'+x.amount,'Amount'],[x=>x.status,'Status'],[x=>x.mode,'Mode']])}catch(e){$('output').textContent=e.message}}async function loadCodes(){try{let d=await request('/api/admin/codes');$('output').innerHTML='<h2>Access codes</h2>'+table(d,[[x=>x.code,'Code'],[x=>x.planId,'Package'],[x=>x.status,'Status'],[x=>x.redeemedBy||'—','Redeemed by']])}catch(e){$('output').textContent=e.message}}async function generateCodes(){try{let d=await request('/api/admin/codes',{method:'POST',body:JSON.stringify({planId:$('plan').value,count:+$('count').value})});$('msg').innerHTML='<b>Generated '+d.codes.length+' codes:</b><pre>'+d.codes.map(x=>x.code).join('\n')+'</pre>';loadCodes()}catch(e){$('msg').textContent=e.message}}async function addQuestion(){try{await request('/api/admin/questions',{method:'POST',body:JSON.stringify({programme:p.value,category:cat.value,difficulty:d.value,question:q.value,options:[a.value,b.value,c.value,e.value],correct:+correct.value,explanation:ex.value})});$('qmsg').textContent='Question added.'}catch(e){$('qmsg').textContent=e.message}}
</script></body></html>
